[project]
name = "aviation-weather-support"
version = "0.1.0"
description = "A METAR dashboard and CLI with validated current-condition operational flags."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "watts26", email = "jmwatts26@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "streamlit>=1.60.0",
]

[project.scripts]
aviation-weather-support = "aviation_weather_support:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "pytest>=9.1.1",
]
